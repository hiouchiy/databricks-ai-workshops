[project]
name = "agent-server"
version = "0.1.0"
description = "MLflow-compatible agent server with FastAPI"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11,<3.13"
# 依存ライブラリは「ピン止め（==）」する。
# 理由: AI/エージェント関連 OSS は破壊的変更が頻繁に入り、緩い制約（>=）だと数日〜数週で挙動が変わる。
# ワークショップではユーザー環境で確実に動くことが最重要なので、確認済みバージョンを固定する。
# 更新時は uv.lock とセットで再検証してから引き上げる。
# 検証済み: 2026-05-05（agent-evaluate / agent-evaluate-chat 完走確認）
dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "databricks-langchain[memory]==0.17.0",
    "databricks-sdk==0.102.0",
    "databricks-agents==1.9.3",
    "mlflow==3.10.1",
    "langgraph==1.1.3",
    "langchain==1.2.13",
    "langchain-core==1.2.20",
    "langchain-mcp-adapters==0.2.2",
    "litellm==1.82.6",
    "python-dotenv==1.2.2",
    "uuid-utils==0.14.1",
    "streamlit==1.56.0",
    "customtkinter==5.2.2",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_server*", "scripts*"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit a real Databricks workspace (gated; not run by default)",
]
# Default: skip live tests (run with `pytest -m live` explicitly to include them)
addopts = "-m 'not live'"


[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent_multi_turn:evaluate"
agent-evaluate-advanced = "agent_server.evaluate_agent_multi_turn_advanced:evaluate"
agent-evaluate-chat = "agent_server.evaluate_agent_chat:evaluate"
discover-tools = "scripts.discover_tools:main"
register-prompt = "scripts.register_prompt:main"
cleanup = "scripts.cleanup:main"
grant-team-access = "scripts.grant_team_access:main"
grant-sp-permissions = "scripts.grant_sp_permissions:main"
quickstart-ui = "scripts.quickstart_gui:main"
